name: 모닝 리포트

on:
  # 평일 아침 6시 45분 (KST). GitHub 예약은 5~15분 늦게 도는 일이 흔해서
  # 7시보다 조금 당겨 두었다. UTC 기준이라 21:45 이고, 요일도 하루 밀린다.
  # 일~목 UTC = 월~금 KST
  schedule:
    - cron: "45 21 * * 0-4"
  # 손으로 돌려볼 수 있게 열어 둔다
  workflow_dispatch:
    inputs:
      force:
        description: "휴장일에도 강제로 만들기"
        type: boolean
        default: false
      no_send:
        description: "카톡 발송 없이 만들기만"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 겹쳐 돌지 않게 한 번에 하나만
concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      send_failed: ${{ steps.send.outputs.failed }}
      send_reason: ${{ steps.send.outputs.reason }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 설정 파일 만들기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 액세스 토큰은 비워 둔다. 리프레시 토큰으로 매번 새로 받는다.
          {
            echo "KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY"
            echo "KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET"
            echo "KAKAO_REFRESH_TOKEN=$KAKAO_REFRESH_TOKEN"
            echo "KAKAO_ACCESS_TOKEN="
            echo "KAKAO_TOKEN_EXPIRES_AT=0"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
          } > .env

      - name: 브리핑 만들기
        run: |
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.no_send }}" = "true" ] && ARGS="$ARGS --no-send"
          python run.py $ARGS

      # 카카오 리프레시 토큰은 만료가 가까워지면 새 것으로 바뀐다.
      # 여기서 다시 저장해 두지 않으면 두 달쯤 뒤에 발송이 조용히 멈춘다.
      - name: 카카오 토큰 갱신분 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SECRETS_PAT 가 없어 토큰 저장을 건너뜁니다."
            exit 0
          fi
          TOKEN=$(grep '^KAKAO_REFRESH_TOKEN=' .env | cut -d= -f2-)
          if [ -n "$TOKEN" ]; then
            gh secret set KAKAO_REFRESH_TOKEN --body "$TOKEN"
            echo "리프레시 토큰을 저장했습니다."
          fi

      - name: 결과 정리
        run: |
          # 사람이 실수로 열어볼 수 있는 파일은 올리지 않는다
          rm -f out/texts.json out/demo*.html out/demo*.png out/preview.png
          rm -f out/capture.html out/demo_capture.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # 카톡이 안 갔는지 여기서 확인만 하고 넘긴다. 여기서 바로 실패시키면
      # 뒤따르는 deploy 가 건너뛰어져 페이지까지 같이 죽는다.
      - name: 발송 결과 확인
        id: send
        run: |
          if [ -f SEND_FAILED ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "reason<<EOF" >> "$GITHUB_OUTPUT"
            cat SEND_FAILED >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 만들기는 됐는데 카톡만 안 간 경우를 빨간불로 남긴다.
  # 조용히 초록불로 끝나면 리포트가 안 와도 며칠씩 모른다.
  # 페이지 배포와 나란히 돌기 때문에 이 잡이 실패해도 페이지는 올라간다.
  send-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 발송 실패 알리기
        if: needs.build.outputs.send_failed == 'true'
        # 실패 사유는 카카오 서버가 보낸 글이다. run 안에 그대로 펼치면
        # 따옴표 같은 글자가 명령으로 섞일 수 있어 환경 변수로 넘긴다.
        env:
          REASON: ${{ needs.build.outputs.send_reason }}
        run: |
          echo "::error::카톡 발송에 실패했습니다. 페이지는 올라갔습니다."
          echo "$REASON"
          echo
          echo "카카오 토큰이 만료됐을 가능성이 큽니다."
          echo "step1_auth.py 로 다시 로그인한 뒤 KAKAO_REFRESH_TOKEN 시크릿을 갱신하세요."
          exit 1
